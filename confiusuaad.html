<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuración de Usuarios</title>

    <style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f5f5f5;
    }

      /* Encabezado */
    .header {
        background-color: #7b0d0d;
        color: white;
        padding: 18px 25px;
        font-size: 22px;
        font-weight: bold;
    }

      /* Título */
    .main-title {
        text-align: center;
        font-size: 30px;
        margin: 30px 0;
        font-weight: bold;
    }

      /* Contenedor general */
    .container {
        width: 90%;
        margin: auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 25px;
    }

      /* Tarjetas */
    .card {
        background: #ffffff;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
    }

    .card h3 {
        margin-top: 0;
        display: flex;
        align-items: center;
        font-size: 22px;
        font-weight: bold;
        gap: 10px;
    }

    .input-group {
        margin-top: 12px;
    }

    .input-group label {
        display: block;
        font-size: 14px;
        margin-bottom: 4px;
        color: #555;
    }

    input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        margin-bottom: 10px;
    }

    button {
        background-color: #7b0d0d;
        color: white;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
        width: 100%;
        font-size: 15px;
        font-weight: bold;
    }

    button:hover {
        background-color: #5c0a0a;
    }

      /* Lista de usuarios */
    .user-card {
        background: #fff;
        padding: 18px;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        margin-top: 15px;
    }

    .user-info p {
        margin: 4px 0;
    }

    .inactive {
        background-color: #f0f0f0;
        opacity: 0.7;
    }
    </style>
</head>

<body>
    <!-- Encabezado -->
    <div class="header">Página Principal – Rol: Administrador</div>

    <!-- Título -->
    <div class="main-title">Configuración de Usuarios</div>

    <!-- Contenedor -->
    <div class="container">
    <!-- Crear cuenta -->
    <div class="card">
        <h3>🏢 Crear Cuenta de Oficina</h3>

        <div class="input-group">
        <label>Nombre de Oficina</label>
        <input type="text" id="oficina" />
        </div>

        <div class="input-group">
        <label>Usuario</label>
        <input type="text" id="usuario" />
        </div>

        <div class="input-group">
        <label>Contraseña</label>
        <input type="text" id="contra" />
        </div>

        <button onclick="crearUsuario()">Crear Usuario</button>
    </div>

    <!-- Usuarios activos -->
    <div class="card">
        <h3>🟢 Usuarios Activos</h3>
        <div id="activos"></div>
    </div>

    <!-- Usuarios inactivos -->
    <div class="card">
        <h3>⚪ Usuarios Inactivos</h3>
        <div id="inactivos"></div>
    </div>
    </div>

    <script>
    let activos = [];
    let inactivos = [];

    function crearUsuario() {
        let oficina = document.getElementById("oficina").value;
        let usuario = document.getElementById("usuario").value;
        let contra = document.getElementById("contra").value;

        if (!oficina || !usuario || !contra) {
        alert("Por favor complete todos los campos.");
        return;
        }

        let nuevo = { oficina, usuario, contra };

        activos.push(nuevo);
        mostrarUsuarios();

        // limpiar
        document.getElementById("oficina").value = "";
        document.getElementById("usuario").value = "";
        document.getElementById("contra").value = "";
    }

    function desactivar(index) {
        inactivos.push(activos[index]);
        activos.splice(index, 1);
        mostrarUsuarios();
    }

    function activar(index) {
        activos.push(inactivos[index]);
        inactivos.splice(index, 1);
        mostrarUsuarios();
    }

    function mostrarUsuarios() {
        // Activos
        let act = document.getElementById("activos");
        act.innerHTML = "";
        activos.forEach((u, i) => {
        act.innerHTML += `
        <div class="user-card">
            <div class="user-info">
            <p><strong>Oficina:</strong> ${u.oficina}</p>
            <p><strong>Usuario:</strong> ${u.usuario}</p>
            <p><strong>Contraseña:</strong> ${u.contra}</p>
            </div>
            <button onclick="desactivar(${i})">Desactivar</button>
        </div>
        `;
        });

        // Inactivos
        let ina = document.getElementById("inactivos");
        ina.innerHTML = "";
        inactivos.forEach((u, i) => {
        ina.innerHTML += `
        <div class="user-card inactive">
            <div class="user-info">
            <p><strong>Oficina:</strong> ${u.oficina}</p>
            <p><strong>Usuario:</strong> ${u.usuario}</p>
            <p><strong>Contraseña:</strong> ${u.contra}</p>
            </div>
            <button onclick="activar(${i})">Activar</button>
        </div>
        `;
        });
    }
    </script>
</body>
</html>
