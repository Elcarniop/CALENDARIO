<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><title>Configuración de Usuarios</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#f5f5f5; }
    .header { background:#7b0d0d; color:#fff; padding:18px 25px; font-size:22px; font-weight:bold; }
    .main-title { text-align:center; font-size:28px; margin:28px 0; font-weight:bold; }
    .container { width:90%; margin:auto; display:grid;
                 grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:22px; }
    .card { background:#fff; border-radius:12px; padding:24px; box-shadow:0 3px 8px rgba(0,0,0,.13); }
    .card h3 { margin-top:0; font-size:18px; }
    label { display:block; font-size:13px; margin-bottom:3px; color:#555; margin-top:10px; }
    input, select { width:100%; padding:9px; border:1px solid #ccc; border-radius:7px;
                    box-sizing:border-box; font-size:14px; }
    button { background:#7b0d0d; color:#fff; padding:10px; border:none; border-radius:7px;
             cursor:pointer; margin-top:8px; width:100%; font-size:14px; font-weight:bold; }
    button:hover { background:#5c0a0a; }
    .user-card { background:#fff; padding:15px; border-radius:9px;
                 box-shadow:0 2px 5px rgba(0,0,0,.12); margin-top:12px; }
    .user-card p { margin:3px 0; font-size:.88em; }
    .inactive { background:#f0f0f0; opacity:.75; }
    .inline-btns { display:flex; gap:8px; margin-top:8px; }
    .inline-btns button { flex:1; width:auto; }
    .edit-btn { background:#004c97; }
    .back-btn { display:inline-block; margin:14px 24px; background:#333; color:#fff;
                padding:7px 15px; border-radius:6px; text-decoration:none; font-size:.9em; }
  </style>
</head>
<body>
  <div class="header">Página Principal – Rol: Administrador</div>
  <a class="back-btn" href="administrador.html">← Volver</a>
  <div class="main-title">Configuración de Usuarios</div>
  <div class="container">
    <div class="card">
      <h3>🏢 Crear / Editar Cuenta</h3>
      <label>Nombre de Oficina</label><input type="text"     id="oficina" />
      <label>Tipo</label>
      <select id="tipo">
        <option value="Academica">Académica</option>
        <option value="Administrativa">Administrativa</option>
      </select>
      <label>Nombre del Jefe</label>    <input type="text"     id="jefe"    />
      <label>Correo (usuario)</label>   <input type="email"    id="usuario" />
      <label>Contraseña</label>         <input type="password" id="contra"  />
      <button id="btn-crear" onclick="manejarCrearOGuardar()">Crear Usuario</button>
    </div>
    <div class="card">
      <h3>🟢 Usuarios Activos</h3>
      <div id="activos"><p>Cargando...</p></div>
    </div>
    <div class="card">
      <h3>⚪ Usuarios Inactivos</h3>
      <div id="inactivos"><p>Cargando...</p></div>
    </div>
  </div>
  <script src="../js/confiusuaad.js"></script>
</body>
</html>
