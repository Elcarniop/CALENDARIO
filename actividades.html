<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Mis Actividades</title>
    <style>
    body {
        font-family: Arial;
        margin: 0;
        background: #f5f5f5;
        padding: 20px;
    }

    .header {
        background: #7b0d0d;
        color: white;
        padding: 18px;
        font-size: 22px;
        font-weight: bold;
    }

    .container {
        background: white;
        max-width: 700px;
        margin: 30px auto;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.2);
    }

    .title {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 15px;
    }

    .activity-box {
        background: #fafafa;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 15px;
        border-left: 5px solid #7b0d0d;
    }

    .label {
        font-weight: bold;
    }
    </style>
</head>

<body>
    <div class="header">Mis Actividades Registradas</div>

    <div class="container">
    <div class="title">Actividad Guardada</div>

    <div class="activity-box">
        <p><span class="label">Nombre:</span> <span id="nombre"></span></p>
        <p>
        <span class="label">Descripción:</span> <span id="descripcion"></span>
        </p>
        <p>
        <span class="label">Fecha de Inicio:</span> <span id="inicio"></span>
        </p>
        <p>
        <span class="label">Fecha de Terminación:</span>
        <span id="fin"></span>
        </p>
        <p><span class="label">Lugar:</span> <span id="lugar"></span></p>
    </div>
    </div>

    <script>
      // Leer los datos desde la URL
    const params = new URLSearchParams(window.location.search);

    document.getElementById("nombre").textContent = params.get("nombre");
    document.getElementById("descripcion").textContent =
        params.get("descripcion");
    document.getElementById("inicio").textContent = params.get("inicio");
    document.getElementById("fin").textContent = params.get("fin");
    document.getElementById("lugar").textContent = params.get("lugar");
    </script>
</body>
</html>
