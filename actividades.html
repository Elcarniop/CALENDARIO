<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><title>Mis Actividades</title>
  <style>
    body { font-family:Arial; margin:0; background:#f5f5f5; padding:20px; }
    .header { background:#7b0d0d; color:#fff; padding:18px; font-size:22px;
              font-weight:bold; margin:-20px -20px 0; }
    .container { background:#fff; max-width:720px; margin:28px auto; padding:25px;
                 border-radius:12px; box-shadow:0 3px 8px rgba(0,0,0,.2); }
    .activity-box { background:#fafafa; padding:14px; border-radius:9px;
                    margin-bottom:14px; border-left:5px solid #7b0d0d; }
    .activity-box p { margin:3px 0; font-size:.9em; }
    .label { font-weight:bold; }
    .badge { padding:2px 9px; border-radius:9px; font-size:.78em; color:#fff; }
    .badge-pendiente   { background:#e67e22; }
    .badge-aprobada    { background:#27ae60; }
    .badge-actualizada { background:#2980b9; }
    .inline-btns { display:flex; gap:9px; margin-top:10px; }
    .inline-btns button { flex:1; padding:8px; border:none; border-radius:6px;
                          cursor:pointer; font-weight:bold; color:#fff; }
    .edit-btn   { background:#004c97; }
    .delete-btn { background:#7b0d0d; }
    button:disabled { background:#aaa; cursor:not-allowed; }
    .back-btn  { display:inline-block; margin:14px 0; background:#333; color:#fff;
                 padding:7px 15px; border-radius:6px; text-decoration:none; font-size:.9em; }
    .nueva-btn { display:inline-block; background:#7b0d0d; color:#fff; padding:9px 18px;
                 border-radius:7px; text-decoration:none; font-weight:bold; margin-bottom:14px; }
  </style>
</head>
<body>
  <div class="header">Mis Actividades Registradas</div>
  <div class="container">
    <a class="back-btn" href="oficina.html">← Volver</a>
    <a class="nueva-btn" href="registro.html">+ Nueva Actividad</a>
    <div id="lista-actividades"><p>Cargando...</p></div>
  </div>
  <script src="../js/actividades.js"></script>
</body>
</html>
