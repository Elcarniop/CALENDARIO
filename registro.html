<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Registro de Actividades</title>
    <style>
    body {
        font-family: Arial;
        background: #f5f5f5;
        margin: 0;
        padding: 20px;
    }

    .header {
        background: #7b0d0d;
        padding: 18px;
        color: white;
        font-size: 22px;
        font-weight: bold;
    }

    .container {
        background: white;
        max-width: 600px;
        margin: 25px auto;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.2);
    }

    label {
        font-weight: bold;
        margin-top: 12px;
        display: block;
    }

    input,
    textarea {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        border-radius: 6px;
        border: 1px solid #ccc;
    }

    button {
        margin-top: 20px;
        padding: 12px;
        width: 100%;
        background: #7b0d0d;
        color: white;
        border: none;
        font-size: 18px;
        border-radius: 10px;
        cursor: pointer;
    }

    button:hover {
        background: #5e0a0a;
    }
    </style>
</head>

<body>
    <div class="header">Registro de Actividades</div>

    <div class="container">
    <form action="actividades.html" method="GET">
        <label>Nombre de la Actividad</label>
        <input type="text" name="nombre" required />

        <label>Descripción de la Actividad</label>
        <textarea name="descripcion" rows="4" required></textarea>

        <label>Fecha de Inicio</label>
        <input type="date" name="inicio" required />

        <label>Fecha de Terminación</label>
        <input type="date" name="fin" required />

        <label>Lugar</label>
        <input type="text" name="lugar" required />

        <button type="submit">Guardar Actividad</button>
    </form>
    </div>
</body>
</html>
