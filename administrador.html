<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Panel del Administrador</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#f5f5f5; }
    .header { background:#7b0d0d; color:#fff; padding:18px 25px; font-size:22px;
              font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
    .logout-btn { background:#fff; color:#7b0d0d; border:none; border-radius:6px;
                  padding:6px 14px; cursor:pointer; font-weight:bold; }
    .main-title { text-align:center; font-size:28px; margin:35px 0; font-weight:bold; }
    .grid-container { display:grid; gap:25px; width:85%; margin:auto;
                       grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
    .card { background:#fff; padding:25px; border-radius:10px;
            box-shadow:0 3px 6px rgba(0,0,0,.15); text-align:center;
            transition:.2s; text-decoration:none; color:#000; display:block; }
    .card:hover { transform:scale(1.04); }
    .icon { font-size:38px; margin-bottom:10px; display:block; }
  </style>
</head>
<body>
  <div class="header">
    Panel – Administrador
    <button class="logout-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
  </div>
  <div class="main-title">Panel de Control del Administrador</div>
  <div class="grid-container">
    <a href="confiusuaad.html" class="card">
      <span class="icon">⚙️</span><h3>Configuración de Usuarios</h3>
    </a>
    <a href="gestionactiad.html" class="card">
      <span class="icon">✏️</span><h3>Gestión de Actividades</h3>
    </a>
    <a href="informesadministr.html" class="card">
      <span class="icon">📄</span><h3>Informes</h3>
    </a>
  </div>
  <script>
    async function cerrarSesion() {
      await fetch('../api/auth.php', { method: 'DELETE' });
      window.location.href = '../index.html';
    }
  </script>
</body>
</html>
