<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel del Administrador</title>
    <style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f5f5f5;
    }

      /* Encabezado */
    .header {
        background-color: #7b0d0d;
        color: #fff;
        padding: 18px 25px;
        font-size: 22px;
        font-weight: bold;
    }

      /* Título principal */
    .main-title {
        text-align: center;
        font-size: 28px;
        margin: 35px 0;
        font-weight: bold;
    }

      /* Contenedor de botones */
    .grid-container {
        display: grid;
        gap: 25px;
        width: 85%;
        margin: auto;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

      /* Tarjetas */
    .card {
        background-color: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
        text-align: center;
        transition: 0.2s;
        text-decoration: none; /* evitar subrayado */
        color: black; /* asegurar texto negro */
    }

    .card:hover {
        transform: scale(1.04);
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        cursor: pointer;
    }

      /* Iconos */
    .icon {
        font-size: 38px;
        margin-bottom: 10px;
        display: block;
    }
    </style>
</head>

<body>
    <!-- Encabezado -->
    <div class="header">Página Principal – Rol: Administrador</div>

    <!-- Título -->
    <div class="main-title">Panel de Control del Administrador</div>

    <!-- Cuadrícula (solo 3 tarjetas) -->
    <div class="grid-container">
    <a href="confiusuaad.html" class="card">
        <span class="icon">⚙️</span>
        <h3>Configuración de Usuarios</h3>
    </a>

    <a href="gestionactiad.html" class="card">
        <span class="icon">✏️</span>
        <h3>Gestión de Actividades</h3>
    </a>

    <a href="informesadministr.html" class="card">
        <span class="icon">📄</span>
        <h3>Informes</h3>
    </a>
    </div>
</body>
</html>
