<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><title>Gestión de Actividades</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#f5f5f5; }
    .header { background:#7b0d0d; color:#fff; padding:18px 25px; font-size:22px; font-weight:bold; }
    .main-title { text-align:center; font-size:26px; margin:24px 0; font-weight:bold; }
    .container { width:90%; margin:auto; display:grid;
                 grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:22px; }
    .card { background:#fff; border-radius:12px; padding:24px; box-shadow:0 3px 8px rgba(0,0,0,.13); }
    .card h3 { margin-top:0; font-size:18px; }
    .input-group { margin-top:10px; }
    .input-group label { font-size:13px; color:#444; display:block; margin-bottom:2px; }
    .input-group input, .input-group textarea, .input-group select {
      width:100%; padding:9px; border-radius:7px; border:1px solid #ccc;
      box-sizing:border-box; font-size:14px; }
    textarea { resize:none; height:65px; }
    button { background:#7b0d0d; color:#fff; padding:10px; border:none; border-radius:7px;
             cursor:pointer; width:100%; margin-top:9px; font-size:14px; }
    button:hover { background:#5c0a0a; }
    .activity-card { background:#fff; padding:15px; border-radius:9px;
                     box-shadow:0 2px 5px rgba(0,0,0,.12); margin-top:12px; }
    .activity-card p { margin:3px 0; font-size:.87em; }
    .activity-card select { padding:3px; border-radius:4px; font-size:.83em; }
    .inline-btns { display:flex; gap:8px; margin-top:9px; }
    .inline-btns button { flex:1; width:auto; }
    .edit-btn   { background:#004c97; } .edit-btn:hover   { background:#003b75; }
    .delete-btn { background:#9e0000; } .delete-btn:hover { background:#750000; }
    .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .back-btn { display:inline-block; margin:14px 24px; background:#333; color:#fff;
                padding:7px 15px; border-radius:6px; text-decoration:none; font-size:.9em; }
  </style>
</head>
<body>
  <div class="header">Página Principal – Rol: Administrador</div>
  <a class="back-btn" href="administrador.html">← Volver</a>
  <div class="main-title">Gestión de Actividades</div>
  <div class="container">
    <div class="card">
      <h3>📝 Crear / Editar Actividad</h3>
      <div class="input-group"><label>Nombre *</label><input type="text" id="nombre" /></div>
      <div class="input-group"><label>Descripción</label><textarea id="descripcion"></textarea></div>
      <div class="row-2">
        <div class="input-group"><label>Fecha Inicio *</label><input type="date" id="inicio" /></div>
        <div class="input-group"><label>Fecha Fin</label>    <input type="date" id="fin"    /></div>
      </div>
      <div class="row-2">
        <div class="input-group"><label>Hora Inicio</label><input type="time" id="hora_inicio" /></div>
        <div class="input-group"><label>Hora Fin</label>   <input type="time" id="hora_fin"    /></div>
      </div>
      <div class="input-group"><label>Lugar</label><input type="text" id="lugar" /></div>
      <div class="input-group">
        <label>Tipo</label>
        <select id="tipo">
          <option value="Cultural">Cultural</option>
          <option value="Academica">Académica</option>
          <option value="Ludica">Lúdica</option>
        </select>
      </div>
      <div class="input-group">
        <label><input type="checkbox" id="es_repetitiva" style="width:auto;margin-right:5px" />
        Actividad repetitiva</label>
      </div>
      <button id="btn-crear" onclick="crearActividad()">Crear Actividad</button>
    </div>
    <div class="card">
      <h3>📅 Actividades Registradas</h3>
      <div id="lista"><p>Cargando...</p></div>
    </div>
  </div>
  <script src="../js/gestionactiad.js"></script>
</body>
</html>
