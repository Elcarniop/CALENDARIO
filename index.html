<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vive el Campus – Calendario</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .leyenda { display:flex; gap:18px; justify-content:center; margin:10px 0; flex-wrap:wrap; }
    .leyenda-item { display:flex; align-items:center; gap:6px; font-size:.85em; }
    .punto-leyenda { width:13px; height:13px; border-radius:50%; display:inline-block; }
    #calendario { max-width:760px; margin:20px auto; }
    .cal-nav { display:flex; justify-content:space-between; align-items:center;
               font-size:1.2em; font-weight:bold; padding:8px 0; }
    .cal-nav button { background:#b50303; color:#fff; border:none; border-radius:6px;
                      padding:6px 14px; cursor:pointer; font-size:1.1em; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
    .cal-header { text-align:center; font-weight:bold; background:#b50303;
                  color:#fff; padding:6px 0; border-radius:4px; font-size:.85em; }
    .cal-day { background:#fff; min-height:68px; border-radius:6px; padding:4px;
               cursor:pointer; border:1px solid #e0e0e0; transition:.15s; }
    .cal-day:hover { background:#fce4e4; }
    .cal-day.empty { background:transparent; border:none; cursor:default; }
    .cal-day.hoy { border:2px solid #b50303; font-weight:bold; }
    .num-dia { font-size:.82em; }
    .puntos-dia { display:flex; flex-wrap:wrap; gap:3px; margin-top:3px; }
    .punto { width:9px; height:9px; border-radius:50%; display:inline-block; }
    .proximas-section { max-width:760px; margin:18px auto; }
    .proximas-section h3 { font-size:1em; margin-bottom:9px; }
    .proxima-card { background:#fff; border-radius:8px; padding:10px 14px;
                    margin-bottom:8px; box-shadow:0 2px 5px rgba(0,0,0,.1);
                    display:flex; flex-direction:column; gap:3px; }
    .proxima-card strong { font-size:.93em; }
    .proxima-card small  { color:#666; font-size:.8em; }
    .tipo-badge { align-self:flex-start; padding:2px 8px; border-radius:10px;
                  color:#fff; font-size:.73em; }
    #modal-dia { display:none; position:fixed; inset:0;
                 background:rgba(0,0,0,.5); justify-content:center;
                 align-items:center; z-index:999; }
    .modal-box { background:#fff; border-radius:12px; padding:24px; max-width:500px;
                 width:90%; max-height:80vh; overflow-y:auto; }
    .modal-box h3 { margin-top:0; }
    .modal-close { float:right; background:#b50303; color:#fff; border:none;
                   border-radius:50%; width:27px; height:27px; cursor:pointer; font-weight:bold; }
    .activity-box { padding:11px; border-left:5px solid #b50303; background:#fafafa;
                    border-radius:6px; margin-bottom:9px; line-height:1.6; font-size:.9em; }
  </style>
</head>
<body>
  <header><span>VIVE EL CAMPUS</span></header>
  <main style="padding:20px">
    <h1 style="text-align:center">VIVE EL CAMPUS</h1>
    <h2 style="text-align:center">CALENDARIO DE ACTIVIDADES</h2>
    <div class="buttons" style="justify-content:center;margin-bottom:14px">
      <a href="html/inicio.html">
        <button class="btn btn-red">INICIAR SESIÓN</button>
      </a>
    </div>
    <div class="leyenda">
      <div class="leyenda-item"><span class="punto-leyenda" style="background:#b50303"></span> Cultural</div>
      <div class="leyenda-item"><span class="punto-leyenda" style="background:#004c97"></span> Académica</div>
      <div class="leyenda-item"><span class="punto-leyenda" style="background:#2e7d32"></span> Lúdica</div>
    </div>
    <div id="calendario"><p style="text-align:center">Cargando calendario...</p></div>
    <div class="proximas-section">
      <h3>📅 Próximas Actividades</h3>
      <div id="proximas-actividades"></div>
    </div>
  </main>
  <div id="modal-dia">
    <div class="modal-box">
      <button class="modal-close" onclick="cerrarModal()">✕</button>
      <h3 id="modal-titulo"></h3>
      <div id="modal-contenido"></div>
    </div>
  </div>
  <footer>Universidad Libre © 2026 — Natalia Ramírez &amp; Sebastián Cáceres</footer>
  <script src="js/index.js"></script>
</body>
</html>
