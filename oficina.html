<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Control de la Oficina</title>

    <style>
    body {
        margin: 0;
        font-family: Arial, helvetica, sans-serif;
        background-color: #f5f5f5;
    }

    .header {
        background-color: #7b0d0d;
        color: white;
        padding: 18px 25px;
        font-size: 22px;
        font-weight: bold;
    }

    .main-title {
        text-align: center;
        font-size: 28px;
        font-weight: bold;
        margin: 35px 0 25px;
    }

    .container {
        width: 90%;
        margin: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 35px;
    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
    }

    .card-title {
        font-size: 20px;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
    }

    .info-line {
        margin: 8px 0;
        font-size: 16px;
    }

    .icon {
        font-size: 32px;
    }

    .button-card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
        font-size: 18px;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        transition: 0.2s;
        text-decoration: none;
        color: black;
    }

    .button-card:hover {
        transform: scale(1.03);
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
    }

    .small-text {
        font-size: 13px;
        color: #555;
        margin-top: -8px;
    }

    @media (max-width: 900px) {
        .container {
        grid-template-columns: 1fr;
        }
    }
    </style>
</head>

<body>
    <div class="header">Página Principal – Rol: Oficina</div>

    <div class="main-title">Panel de Control de la Oficina</div>

    <div class="container">
    <!-- Información de Oficina (sin edición) -->
    <div class="card">
        <div class="card-title">
        <span class="icon">🏢</span>
        Información de la Oficina
        </div>

        <div class="info-line">
        <strong>Nombre:</strong> Oficina de Bienestar
        </div>
        <div class="info-line"><strong>Tipo:</strong> Académica</div>
        <div class="info-line"><strong>Jefe:</strong> María Pérez</div>
        <div class="info-line">
        <strong>Correo:</strong> bienestar@institucion.edu
        </div>
        <div class="info-line"><strong>Estado:</strong> Activo</div>
    </div>

    <!-- Panel derecho -->
    <div>
        <!-- BOTONES NUEVOS -->
        <a href="actividades.html" class="button-card">
        Mis Actividades
        <span class="icon">📋</span>
        </a>

        <a href="registro.html" class="button-card">
        Registro
        <span class="icon">📝</span>
        </a>
    </div>
    </div>
 </body>
</html>
