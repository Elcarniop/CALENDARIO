<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Panel de la Oficina</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#f5f5f5; }
    .header { background:#7b0d0d; color:#fff; padding:18px 25px; font-size:22px;
              font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
    .logout-btn { background:#fff; color:#7b0d0d; border:none; border-radius:6px;
                  padding:6px 14px; cursor:pointer; font-weight:bold; }
    .main-title { text-align:center; font-size:26px; font-weight:bold; margin:28px 0 18px; }
    .container { width:90%; margin:auto; display:grid;
                 grid-template-columns:1fr 1fr; gap:28px; }
    .card { background:#fff; padding:25px; border-radius:12px;
            box-shadow:0 3px 6px rgba(0,0,0,.15); }
    .card-title { font-size:18px; font-weight:bold; display:flex;
                  align-items:center; gap:10px; margin-bottom:14px; }
    .info-line { margin:8px 0; font-size:15px; }
    .btn-card { background:#fff; padding:18px 20px; border-radius:12px;
                box-shadow:0 3px 6px rgba(0,0,0,.15); font-size:17px; font-weight:bold;
                display:flex; justify-content:space-between; align-items:center;
                cursor:pointer; text-decoration:none; color:#000; transition:.2s;
                margin-bottom:14px; }
    .btn-card:hover { background:#fce4e4; transform:scale(1.02); }
    @media(max-width:700px){ .container{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="header">
    Panel – Oficina
    <button class="logout-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
  </div>
  <div class="main-title">Panel de Control de la Oficina</div>
  <div class="container">
    <div class="card">
      <div class="card-title">🏢 Información de la Oficina</div>
      <div class="info-line"><strong>Nombre:</strong> <span id="of-nombre">Cargando...</span></div>
      <div class="info-line"><strong>Correo:</strong> <span id="of-correo">—</span></div>
    </div>
    <div>
      <a href="actividades.html" class="btn-card">Mis Actividades <span>📋</span></a>
      <a href="registro.html"    class="btn-card">Registrar Actividad <span>📝</span></a>
    </div>
  </div>
  <script>
    async function cargarInfo() {
      try {
        const res  = await fetch('../api/auth.php');
        const json = await res.json();
        if (!json.ok) { window.location.href = 'inicio.html'; return; }
        document.getElementById('of-nombre').textContent = json.data.nombre  || '—';
        document.getElementById('of-correo').textContent = json.data.usuario || '—';
      } catch {}
    }
    async function cerrarSesion() {
      await fetch('../api/auth.php', { method: 'DELETE' });
      window.location.href = '../index.html';
    }
    document.addEventListener('DOMContentLoaded', cargarInfo);
  </script>
</body>
</html>
