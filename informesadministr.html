<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><title>Generación de Informes</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#f5f5f5; }
    .header { background:#7b0d0d; color:#fff; padding:18px 25px; font-size:22px; font-weight:bold; }
    .main-title { text-align:center; font-size:26px; margin:24px 0; font-weight:bold; }
    .container { width:90%; margin:auto; display:grid;
                 grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:22px; }
    .card { background:#fff; border-radius:12px; padding:24px; box-shadow:0 3px 8px rgba(0,0,0,.13); }
    .card h3 { margin-top:0; font-size:18px; }
    .input-group { margin-top:10px; }
    .input-group label { font-size:13px; color:#444; display:block; margin-bottom:2px; }
    .input-group input, .input-group select {
      width:100%; padding:9px; border-radius:7px;
      border:1px solid #ccc; box-sizing:border-box; }
    button { background:#7b0d0d; color:#fff; padding:10px; border:none; border-radius:7px;
             cursor:pointer; width:100%; margin-top:9px; font-size:14px; }
    button:hover { background:#5c0a0a; }
    .report-card { background:#f9f9f9; padding:13px; border-radius:8px;
                   box-shadow:0 1px 4px rgba(0,0,0,.1); margin-top:11px; }
    .report-card p { margin:3px 0; font-size:.86em; }
    .inline-btns { display:flex; gap:8px; margin-top:11px; flex-wrap:wrap; }
    .inline-btns button { flex:1; min-width:80px; width:auto; }
    .export-btn { background:#004c97; } .export-btn:hover { background:#003b75; }
    .hist-btn   { background:#555; }
    .back-btn { display:inline-block; margin:14px 24px; background:#333; color:#fff;
                padding:7px 15px; border-radius:6px; text-decoration:none; font-size:.9em; }
    @media print {
      .header,.back-btn,.inline-btns,.input-group,button { display:none !important; }
    }
  </style>
</head>
<body>
  <div class="header">Página Principal – Rol: Administrador</div>
  <a class="back-btn" href="administrador.html">← Volver</a>
  <div class="main-title">Generación de Informes</div>
  <div class="container">
    <div class="card">
      <h3>🔍 Filtros</h3>
      <div class="input-group">
        <label>Estado</label>
        <select id="estado">
          <option value="">Todos</option>
          <option value="pendiente">Pendiente</option>
          <option value="aprobada">Aprobada</option>
          <option value="actualizada">Actualizada</option>
        </select>
      </div>
      <div class="input-group">
        <label>Tipo</label>
        <select id="tipo">
          <option value="">Todos</option>
          <option value="Cultural">Cultural</option>
          <option value="Academica">Académica</option>
          <option value="Ludica">Lúdica</option>
        </select>
      </div>
      <div class="input-group"><label>Oficina</label>
        <input type="text" id="oficina" placeholder="Nombre parcial" /></div>
      <div class="input-group"><label>Descripción contiene</label>
        <input type="text" id="descripcionFiltro" /></div>
      <div class="input-group"><label>Fecha desde</label>
        <input type="date" id="fechaInicio" /></div>
      <div class="input-group"><label>Fecha hasta</label>
        <input type="date" id="fechaFin" /></div>
      <button onclick="generarInforme()">📊 Generar Informe</button>
      <div class="inline-btns" style="margin-top:12px">
        <button id="btn-historial" class="hist-btn">🕓 Historial (RF20)</button>
      </div>
    </div>
    <div class="card">
      <h3>📄 Informe Generado</h3>
      <div id="resultados"><p style="color:#888">Aplique filtros y presione Generar.</p></div>
      <div class="inline-btns">
        <button class="export-btn" onclick="exportar('PDF')">📥 PDF</button>
        <button class="export-btn" onclick="exportar('Excel')">📥 Excel</button>
        <button class="export-btn" onclick="exportar('CSV')">📥 CSV</button>
      </div>
    </div>
  </div>
  <script src="../js/informesadministr.js"></script>
</body>
</html>
